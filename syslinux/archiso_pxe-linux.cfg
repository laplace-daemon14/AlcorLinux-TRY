LABEL alcor_nbd
TEXT HELP
Boot the Alcor GNU/Linux install medium using NBD.
It allows you to install Alcor GNU/Linux or perform system maintenance.
ENDTEXT
MENU LABEL Alcor GNU/Linux install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

